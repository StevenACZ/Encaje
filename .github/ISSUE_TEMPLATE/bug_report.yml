name: Bug report
description: Report unexpected window or setup behavior
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Encaje and macOS versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected app, monitor arrangement and shortcut. Remove private window titles and content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private information from any screenshots or logs.
          required: true
